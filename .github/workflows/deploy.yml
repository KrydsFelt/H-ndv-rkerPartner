name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: |
          PROJ=$(find . -name "*.csproj" | head -1)
          dotnet publish "$PROJ" -c Release -o release --nologo

      - name: Fix static files
        run: |
          touch release/wwwroot/.nojekyll
          SRCDIR=$(find . -path "*/wwwroot/404.html" | grep -v "release\|bin\|obj" | head -1)
          if [ -n "$SRCDIR" ]; then cp "$SRCDIR" release/wwwroot/404.html; fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: release/wwwroot
          branch: gh-pages
          clean: true
