name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: |
          PROJ=$(find . -name "*.csproj" | head -1)
          dotnet publish "$PROJ" -c Release -o release --nologo

      - name: Patch base href and copy SPA files
        run: |
          sed -i 's|<base href="/" />|<base href="/H-ndv-rkerPartner/" />|g' release/wwwroot/index.html
          touch release/wwwroot/.nojekyll
          cp 'HåndværkerPartner/wwwroot/404.html' release/wwwroot/404.html
          # Strip integrity hashes from blazor.boot.json so GitHub Pages gzip serving doesn't break them
          python3 -c "
          import json, re, sys
          with open('release/wwwroot/_framework/blazor.boot.json', 'r') as f:
              content = f.read()
          data = json.loads(content)
          def strip_hashes(obj):
              if isinstance(obj, dict):
                  return {k: strip_hashes(v) for k, v in obj.items()}
              if isinstance(obj, list):
                  return [strip_hashes(i) for i in obj]
              if isinstance(obj, str) and obj.startswith('sha256-'):
                  return ''
              return obj
          data = strip_hashes(data)
          with open('release/wwwroot/_framework/blazor.boot.json', 'w') as f:
              json.dump(data, f)
          print('Stripped integrity hashes from blazor.boot.json')
          "

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
