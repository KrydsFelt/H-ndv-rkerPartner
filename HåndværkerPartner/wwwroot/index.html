<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HåndværkerPartner – Din faglige samarbejdspartner</title>
    <base href="/" />
    <script>
        var redirect = sessionStorage.getItem('redirect');
        if (redirect) {
            sessionStorage.removeItem('redirect');
            var url = new URL(redirect);
            history.replaceState(null, null, url.pathname + url.search + url.hash);
        }
    </script>
    <link rel="stylesheet" href="css/app.css" />
    <style>
        #loading-screen {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(232, 119, 34, 0.18), transparent 38%),
                linear-gradient(180deg, #181818 0%, #111111 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #loading-screen.ls-hide {
            opacity: 0;
            visibility: hidden;
        }
        .ls-shell {
            width: min(88vw, 420px);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .ls-logo {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-weight: 900;
            font-size: clamp(28px, 5vw, 40px);
            letter-spacing: 0.04em;
            color: #ffffff;
            text-transform: none;
            min-height: 1.2em;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .ls-cursor {
            width: 2px;
            height: 1.02em;
            background: #E87722;
            box-shadow: 0 0 14px rgba(232, 119, 34, 0.45);
            animation: ls-blink 0.8s step-end infinite;
        }
        @keyframes ls-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .ls-status {
            color: rgba(255, 255, 255, 0.62);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .ls-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }
        .ls-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #E87722 0%, #f5a14d 100%);
            border-radius: inherit;
            box-shadow: 0 0 24px rgba(232, 119, 34, 0.45);
            transition: width 0.18s ease-out;
        }
        .ls-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .ls-percent {
            color: rgba(255, 255, 255, 0.72);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }
    </style>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="HaandvaerkerPartner.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div id="loading-screen" aria-live="polite" aria-busy="true">
            <div class="ls-shell">
                <div class="ls-logo" id="ls-logo">
                    <span id="ls-logo-text"></span>
                    <span class="ls-cursor"></span>
                </div>
                <div class="ls-meta">
                    <div class="ls-status" id="ls-status">Indlæser website</div>
                    <div class="ls-percent" id="ls-percent">0%</div>
                </div>
                <div class="ls-bar"><div class="ls-bar-fill" id="ls-bar-fill"></div></div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none">
        Der opstod en fejl.
        <a href="." class="reload">Genindlæs</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        window.siteLoader = (function () {
            var screen = document.getElementById('loading-screen');
            var bar = document.getElementById('ls-bar-fill');
            var percent = document.getElementById('ls-percent');
            var status = document.getElementById('ls-status');
            var logoText = document.getElementById('ls-logo-text');
            var startedAt = Date.now();
            var minVisibleMs = 2400;
            var typeText = 'Håndværkerskolen';
            var typedChars = 0;
            var typingDone = false;
            var progress = 0;
            var target = 0;
            var appReady = false;
            var revealQueued = false;
            var rafId = 0;

            function paint() {
                bar.style.width = progress.toFixed(1) + '%';
                percent.textContent = Math.round(progress) + '%';
            }

            function tick() {
                progress += (target - progress) * ((appReady && typingDone) ? 0.26 : 0.08);

                if (Math.abs(target - progress) < 0.2) {
                    progress = target;
                }

                paint();

                if (progress < 100 || !(appReady && typingDone)) {
                    rafId = requestAnimationFrame(tick);
                }
            }

            function setTarget(nextTarget) {
                target = Math.max(target, Math.min(nextTarget, (appReady && typingDone) ? 100 : 94));
                if (!rafId) {
                    rafId = requestAnimationFrame(function () {
                        rafId = 0;
                        tick();
                    });
                }
            }

            function hide() {
                if (!screen) {
                    return;
                }

                screen.classList.add('ls-hide');

                setTimeout(function () {
                    screen.remove();
                }, 500);
            }

            function queueReveal() {
                if (revealQueued || !appReady || !typingDone) {
                    return;
                }

                revealQueued = true;

                var remaining = Math.max(0, minVisibleMs - (Date.now() - startedAt));
                status.textContent = 'Klar';

                setTimeout(function () {
                    setTarget(100);
                    setTimeout(hide, 320);
                }, remaining);
            }

            function typeNext() {
                typedChars += 1;
                logoText.textContent = typeText.slice(0, typedChars);
                setTarget(12 + (typedChars / typeText.length) * 72);

                if (typedChars < typeText.length) {
                    setTimeout(typeNext, 90);
                    return;
                }

                typingDone = true;
                status.textContent = appReady ? 'Klar' : 'Starter app';
                setTarget(94);
                queueReveal();
            }

            paint();
            setTimeout(typeNext, 140);

            return {
                complete: function () {
                    appReady = true;
                    status.textContent = typingDone ? 'Klar' : 'Forbereder indhold';
                    queueReveal();
                },
                fail: function () {
                    status.textContent = 'Kunne ikke indlæse';
                }
            };
        })();
    </script>
    <script src="js/site.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start()
            .then(function () {
                window.siteLoader.complete();
            })
            .catch(function (error) {
                window.siteLoader.fail();
                throw error;
            });
    </script>
</body>

</html>
