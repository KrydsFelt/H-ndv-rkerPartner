<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HåndværkerPartner – Din faglige samarbejdspartner</title>
    <base href="/" />
    <script>
        var redirect = sessionStorage.getItem('redirect');
        if (redirect) {
            sessionStorage.removeItem('redirect');
            var url = new URL(redirect);
            history.replaceState(null, null, url.pathname + url.search + url.hash);
        }
    </script>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background:
                radial-gradient(circle at 50% 35%, rgba(232,119,34,0.2), transparent 28%),
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.04), transparent 42%),
                linear-gradient(180deg, #0f1115 0%, #090a0d 100%);
            transition: opacity 0.55s ease;
            overflow: hidden;
        }
        #loading-screen.ls-hide { opacity: 0; pointer-events: none; }

        #loading-screen .sequence {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
        }

        #loading-screen .brand-wrap,
        #loading-screen .tagline-wrap {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            will-change: transform, opacity, filter;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
            width: 100%;
            padding: 0 2rem;
        }

        #loading-screen .brand-wrap {
            opacity: 0;
            filter: blur(14px);
        }
        #loading-screen .brand-wrap.is-in {
            animation: brand-throw 0.62s ease forwards;
        }
        #loading-screen .brand-wrap.is-out {
            animation: brand-exit 0.4s ease forwards;
        }
        #loading-screen .brand-mark {
            display: block;
            font-family: 'Poppins', system-ui, sans-serif;
            font-size: clamp(2rem, 6vw, 4.8rem);
            font-weight: 800;
            letter-spacing: -0.06em;
            text-transform: uppercase;
            white-space: nowrap;
            line-height: 0.9;
            text-align: center;
            color: #f5f2ec;
            text-shadow: 0 14px 34px rgba(0,0,0,0.34);
        }
        #loading-screen .brand-mark-partner {
            color: #E87722;
            display: inline-block;
        }
        @keyframes brand-throw {
            0% { opacity: 0; filter: blur(14px); transform: translateY(-46%) scale(0.92); }
            100% { opacity: 1; filter: blur(0); transform: translateY(-50%) scale(1); }
        }
        @keyframes brand-exit {
            0% { opacity: 1; transform: translateY(-50%) scale(1); }
            100% { opacity: 0; transform: translateY(-58%) scale(0.92); }
        }

        #loading-screen .tagline-wrap {
            opacity: 0;
            filter: blur(16px);
        }
        #loading-screen .tagline-wrap.is-in {
            animation: tagline-throw 0.62s ease forwards;
        }
        #loading-screen .tagline-copy {
            font-family: 'Poppins', system-ui, sans-serif;
            font-size: clamp(1rem, 2.2vw, 2.1rem);
            font-style: normal;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.04em;
            text-align: center;
            color: #f6f2ea;
            text-transform: uppercase;
            text-shadow: 0 16px 42px rgba(0,0,0,0.34);
            white-space: normal;
        }
        @keyframes tagline-throw {
            0% { opacity: 0; filter: blur(16px); transform: translateY(-46%) scale(0.94); }
            100% { opacity: 1; filter: blur(0); transform: translateY(-50%) scale(1); }
        }

        @media (max-width: 640px) {
            #loading-screen .brand-wrap,
            #loading-screen .tagline-wrap {
                padding: 0 0.75rem;
            }

            #loading-screen .brand-mark {
                font-size: clamp(1.2rem, 6.1vw, 2.05rem);
                letter-spacing: -0.035em;
            }
            #loading-screen .tagline-copy {
                font-size: clamp(0.78rem, 2.9vw, 0.98rem);
                line-height: 1.15;
            }
        }
    </style>
    <link rel="icon" type="image/png" href="logo.png" />
    <link href="HaandvaerkerPartner.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="loading-screen">
        <div class="sequence">
            <div class="brand-wrap" id="ls-brand">
                <div class="brand-mark">HÅNDVÆRKER<span class="brand-mark-partner">PARTNER</span></div>
            </div>
            <div class="tagline-wrap" id="ls-tagline">
                <div class="tagline-copy">NÅR DET SKAL GØRES ORDENTLIGT.</div>
            </div>
        </div>
    </div>

    <div id="app"></div>

    <div id="blazor-error-ui" style="display:none">
        Der opstod en fejl.
        <a href="." class="reload">Genindlæs</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        (function () {
            var sequenceDone = false;
            var appReady = false;

            function hideLoader() {
                var screen = document.getElementById('loading-screen');
                if (!screen) return;
                screen.classList.add('ls-hide');
                setTimeout(function () {
                    if (screen) screen.remove();
                }, 550);
            }

            function tryHide() {
                if (sequenceDone && appReady) {
                    setTimeout(hideLoader, 180);
                }
            }

            function watchAppReady() {
                var app = document.getElementById('app');
                if (!app) return;

                if (app.children.length > 0) {
                    appReady = true;
                    tryHide();
                    return;
                }

                var observer = new MutationObserver(function () {
                    if (app.children.length > 0) {
                        appReady = true;
                        observer.disconnect();
                        tryHide();
                    }
                });

                observer.observe(app, { childList: true });
            }

            function runIntro() {
                var brand = document.getElementById('ls-brand');
                var tagline = document.getElementById('ls-tagline');

                if (!brand || !tagline) {
                    sequenceDone = true;
                    tryHide();
                    return;
                }

                setTimeout(function () {
                    brand.classList.add('is-in');
                }, 180);

                setTimeout(function () {
                    brand.classList.add('is-out');
                }, 1750);

                setTimeout(function () {
                    tagline.classList.add('is-in');
                }, 2100);

                setTimeout(function () {
                    sequenceDone = true;
                    tryHide();
                }, 3400);
            }

            watchAppReady();
            runIntro();

            window.siteLoader = {
                complete: function () {
                    appReady = true;
                    tryHide();
                },
                fail: function () {
                    hideLoader();
                }
            };

            setTimeout(hideLoader, 12000);
        })();
    </script>
    <script src="js/site.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
