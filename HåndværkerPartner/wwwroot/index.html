<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HåndværkerPartner – Din faglige samarbejdspartner</title>
    <base href="/" />
    <script>
        var redirect = sessionStorage.getItem('redirect');
        if (redirect) {
            sessionStorage.removeItem('redirect');
            var url = new URL(redirect);
            history.replaceState(null, null, url.pathname + url.search + url.hash);
        }
    </script>
    <link rel="stylesheet" href="css/app.css" />
    <style>
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #loading-screen.ls-hide {
            opacity: 0;
            visibility: hidden;
        }
        .ls-logo {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-weight: 900;
            font-size: clamp(20px, 4vw, 32px);
            letter-spacing: 0.06em;
            color: #ffffff;
            text-transform: uppercase;
            min-height: 1.2em;
            display: flex;
            align-items: center;
        }
        .ls-logo .ls-orange { color: #E87722; }
        .ls-cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background: #E87722;
            margin-left: 2px;
            vertical-align: middle;
            animation: ls-blink 0.7s step-end infinite;
        }
        @keyframes ls-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .ls-bar {
            width: 160px;
            height: 2px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .ls-bar-fill {
            height: 100%;
            width: 0%;
            background: #E87722;
            border-radius: 2px;
            transition: width 0.2s ease;
        }
    </style>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="HaandvaerkerPartner.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div id="loading-screen">
            <div class="ls-logo" id="ls-text"><span class="ls-cursor"></span></div>
            <div class="ls-bar"><div class="ls-bar-fill" id="ls-bar-fill"></div></div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none">
        Der opstod en fejl.
        <a href="." class="reload">Genindlæs</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        (function () {
            var part1 = 'HÅNDVÆRKER';
            var part2 = 'PARTNER';
            var full = part1 + part2;
            var el = document.getElementById('ls-text');
            var bar = document.getElementById('ls-bar-fill');
            var i = 0;
            var minDuration = 2200; // minimum ms the screen shows
            var started = Date.now();
            var blazorReady = false;
            var typingDone = false;

            // Typing speed: total chars / time budget
            var charDelay = 68;

            function render() {
                var typed = full.slice(0, i);
                var p1 = typed.slice(0, part1.length);
                var p2 = typed.slice(part1.length);
                el.innerHTML =
                    (p1 ? p1 : '') +
                    (p2 ? '<span class="ls-orange">' + p2 + '</span>' : '') +
                    '<span class="ls-cursor"></span>';
            }

            function typeNext() {
                if (i <= full.length) {
                    // progress bar follows typing
                    bar.style.width = Math.round((i / full.length) * 80) + '%';
                    render();
                    i++;
                    setTimeout(typeNext, charDelay);
                } else {
                    typingDone = true;
                    bar.style.width = '90%';
                    tryHide();
                }
            }

            function tryHide() {
                if (!typingDone) return;
                var elapsed = Date.now() - started;
                var remaining = minDuration - elapsed;
                setTimeout(function () {
                    bar.style.width = '100%';
                    setTimeout(function () {
                        var screen = document.getElementById('loading-screen');
                        if (screen) screen.classList.add('ls-hide');
                        setTimeout(function () {
                            if (screen) screen.remove();
                        }, 500);
                    }, 200);
                }, Math.max(0, remaining));
            }

            // Start typing immediately
            setTimeout(typeNext, 120);

            // Blazor calls this when the app is ready — we listen via MutationObserver
            // on #app to detect when Blazor has replaced the loading screen content
            var observer = new MutationObserver(function () {
                blazorReady = true;
                tryHide();
            });
            // We watch document.body for Blazor removing #loading-screen from #app
            observer.observe(document.getElementById('app'), { childList: true, subtree: false });
        })();
    </script>
    <script src="js/site.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
