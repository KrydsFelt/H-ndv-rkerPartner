<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HåndværkerPartner – Din faglige samarbejdspartner</title>
    <base href="/" />
    <script>
        var redirect = sessionStorage.getItem('redirect');
        if (redirect) {
            sessionStorage.removeItem('redirect');
            var url = new URL(redirect);
            history.replaceState(null, null, url.pathname + url.search + url.hash);
        }
    </script>
    <link rel="stylesheet" href="css/app.css" />
    <style>
        #loading-screen {
            position: fixed;
            inset: 0;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            z-index: 9999;
        }
        .ls-logo {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-weight: 900;
            font-size: clamp(20px, 4vw, 32px);
            letter-spacing: 0.06em;
            color: #ffffff;
            text-transform: uppercase;
        }
        .ls-logo span { color: #E87722; }
        .ls-bar {
            width: 160px;
            height: 2px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .ls-bar-fill {
            height: 100%;
            width: 0%;
            background: #E87722;
            border-radius: 2px;
            animation: ls-load 1.6s ease-in-out forwards;
        }
        @keyframes ls-load {
            0%   { width: 0%; }
            60%  { width: 75%; }
            90%  { width: 92%; }
            100% { width: 100%; }
        }
    </style>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="HaandvaerkerPartner.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div id="loading-screen">
            <div class="ls-logo">HÅNDVÆRKER<span>PARTNER</span></div>
            <div class="ls-bar"><div class="ls-bar-fill"></div></div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none">
        Der opstod en fejl.
        <a href="." class="reload">Genindlæs</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/site.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
