<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HåndværkerPartner – Din faglige samarbejdspartner</title>
    <base href="/" />
    <script>
        var redirect = sessionStorage.getItem('redirect');
        if (redirect) {
            sessionStorage.removeItem('redirect');
            var url = new URL(redirect);
            history.replaceState(null, null, url.pathname + url.search + url.hash);
        }
    </script>
    <link rel="stylesheet" href="css/app.css" />
    <style>
        #loading-screen {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at top, rgba(232, 119, 34, 0.18), transparent 38%),
                linear-gradient(180deg, #181818 0%, #111111 100%);
            z-index: 10000;
        }
    </style>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="HaandvaerkerPartner.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="loading-screen"></div>

    <div id="app"></div>

    <div id="blazor-error-ui" style="display:none">
        Der opstod en fejl.
        <a href="." class="reload">Genindlæs</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        window.siteLoader = {
            complete: function () {
                var screen = document.getElementById('loading-screen');
                if (screen) screen.remove();
            },
            fail: function () {
                var screen = document.getElementById('loading-screen');
                if (screen) screen.remove();
            }
        };
        };
    </script>
    <script src="js/site.js"></script>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start()
            .then(function () {
                window.siteLoader.complete();
            })
            .catch(function (error) {
                window.siteLoader.fail();
                throw error;
            });
    </script>
</body>

</html>
